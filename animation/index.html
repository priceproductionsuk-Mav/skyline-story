<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Animation</title>
<style>
  :root {
    --bg: #0E0E10;
    --gold: #E2C68E;
    --amber: #F2B85F;
    --heading: #F2F2F4;
    --eyebrow: #9A9AA0;
    --body: #A8A39A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--heading);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }

  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0;
    background: var(--gold); box-shadow: 0 0 8px var(--amber); z-index: 10; }

  /* Tall scroll track; the stage stays pinned while the visitor scrolls through it */
  .track { height: 700vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0 16px; }
  canvas { width: 100%; max-width: 760px; display: block; }

  .labels { display: flex; justify-content: space-around; width: 100%; max-width: 760px;
    font: 10px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em;
    color: #8A8578; transition: opacity .4s; }
  .copy { text-align: center; margin-top: 12px; }
  .eyebrow { font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .22em; color: var(--eyebrow); }
  .title { font-size: 24px; font-weight: 600; margin-top: 8px; }
  .text { font-size: 15px; color: var(--body); margin-top: 4px; max-width: 32em; }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>

  <section class="track" id="track">
    <div class="stage">
      <canvas id="process-canvas" aria-hidden="true"></canvas>
      <div class="labels" id="labels"><span>SOUND</span><span>CONTROL</span><span>SYSTEM</span><span>TEAM</span></div>
      <div class="copy" aria-live="polite">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
        <div class="text" id="text"></div>
      </div>
    </div>
  </section>

<script src="process-animation.js"></script>
<script>
  const track = document.getElementById('track');
  const N = ProcessAnimation.STAGES.length - 1;

  // 0 at the top of the track, N at the bottom
  function getProgress() {
    const rect = track.getBoundingClientRect();
    const scrollable = track.offsetHeight - window.innerHeight;
    return N * Math.max(0, Math.min(1, -rect.top / scrollable));
  }

  ProcessAnimation.mount(document.getElementById('process-canvas'), {
    getProgress,
    onStageChange(stage) {
      document.getElementById('eyebrow').textContent = stage.eyebrow;
      document.getElementById('title').textContent = stage.title;
      document.getElementById('text').textContent = stage.text;
    },
    onFrame(p, n) {
      document.getElementById('progress').style.width = (p / n * 100) + '%';
      // Labels show only on the "what you get" picture, at the start and the end
      const op = Math.max(Math.max(0, Math.min(1, 1 - p / 0.3)), Math.max(0, Math.min(1, (p - (n - 0.3)) / 0.3)));
      document.getElementById('labels').style.opacity = op;
    }
  });
</script>
</body>
</html>
